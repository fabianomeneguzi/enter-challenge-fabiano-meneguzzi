<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XP Investimentos — Acesso assessores">
  <title>Entrar — Área do Assessor</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body class="login-body">

  <nav class="navbar login-navbar">
    <div class="navbar-brand">
      <span class="navbar-logo">XP</span>
      <div class="navbar-divider"></div>
      <span class="navbar-title">Área do Assessor</span>
    </div>
  </nav>

  <main class="login-main">
    <div class="login-card">
      <h1 class="login-title">Acesso <span>exclusivo</span></h1>
      <p class="login-subtitle">Entre com o e-mail corporativo e a senha fornecida para assessores XP.</p>

      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-label" for="email">E-mail</label>
        <input class="login-input" type="email" id="email" name="email" required
               placeholder="nome.sobrenome@assesorxp.com" autocomplete="username">

        <label class="login-label" for="password">Senha</label>
        <input class="login-input" type="password" id="password" name="password" required
               placeholder="••••••••••••" autocomplete="current-password">

        <p class="login-error" id="login-error" hidden></p>

        <button type="submit" class="login-submit" id="login-submit">
          Entrar
        </button>
      </form>
    </div>
  </main>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-submit');

  errEl.hidden = true;
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando…';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email, password }),
    });

    if (!res.ok) {
      let msg = 'Não foi possível entrar. Verifique e-mail e senha.';
      try {
        const data = await res.json();
        if (data.detail) msg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
      } catch (_) { /* keep default */ }
      errEl.textContent = msg;
      errEl.hidden = false;
      return;
    }

    window.location.href = '/';
  } catch (_) {
    errEl.textContent = 'Erro de conexão. Tente novamente.';
    errEl.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
